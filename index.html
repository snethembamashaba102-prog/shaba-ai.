
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Shaba AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  background: #172337;
  border-bottom: 1px solid #29374b;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #65c9e8;
}

.logo span { color: white; }

header button {
  background: #263a53;
  color: white;
  border: 0;
  padding: 10px;
  border-radius: 8px;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  margin-top: 15vh;
}

.welcome h1 {
  font-size: 32px;
  color: #65c9e8;
}

.welcome p { color: #aab7c8; }

.message {
  padding: 13px 16px;
  border-radius: 14px;
  margin: 12px 0;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #176a91;
  margin-left: auto;
}

.bot {
  background: #26364d;
  margin-right: auto;
}

form {
  display: flex;
  padding: 15px;
  gap: 9px;
  background: #172337;
  border-top: 1px solid #29374b;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 1px solid #43536b;
  border-radius: 12px;
  background: #101827;
  color: white;
  font-size: 16px;
}

form button {
  border: none;
  background: #65c9e8;
  color: #101827;
  border-radius: 12px;
  padding: 0 18px;
  font-size: 17px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 9px;
  color: #8493a8;
  font-size: 11px;
  background: #172337;
}
</style>
</head>

<body>

<header>
  <div class="logo">Shaba <span>AI</span></div>
  <button onclick="newChat()">+ New chat</button>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>Welcome to Shaba AI</h1>
    <p>Your AI assistant in your pocket.</p>
    <p>Ask a question to get started.</p>
  </div>
</main>

<form id="chatForm">
  <input id="messageInput"
    placeholder="Ask Shaba AI anything..."
    autocomplete="off" required>
  <button type="submit">Send</button>
</form>

<footer>
  Shaba AI · Your assistant in your pocket
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");

function addMessage(text, type) {
  document.getElementById("welcome")?.remove();

  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("chatForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  const question = input.value.trim();
  if (!question) return;

  addMessage(question, "user");
  input.value = "";

  setTimeout(() => {
    addMessage(
      "Welcome to Shaba AI! Your chat interface is working. The AI connection is the next development step.",
      "bot"
    );
  }, 500);
});

function newChat() {
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Welcome to Shaba AI</h1>
      <p>Your AI assistant in your pocket.</p>
      <p>Ask a question to get started.</p>
    </div>`;
}
</script>

</body>
</html>
