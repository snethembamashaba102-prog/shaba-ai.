
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaba AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d19;
  color: white;
}
header {
  padding: 20px;
  background: #111a2e;
  border-bottom: 1px solid #26334c;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  background: #6558ee;
  padding: 12px;
  border-radius: 12px;
  font-weight: bold;
}
header h2 { margin: 0; }
header p { margin: 4px 0 0; color: #9daac2; font-size: 12px; }
main {
  max-width: 750px;
  margin: auto;
  padding: 20px;
}
.welcome {
  text-align: center;
  margin: 65px 0 35px;
}
.welcome h1 { font-size: 34px; }
.welcome span { color: #887bff; }
.welcome p { color: #aab5c9; }
#chat {
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding-bottom: 110px;
}
.message {
  padding: 14px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}
.user {
  background: #6558ee;
  align-self: flex-end;
}
.ai {
  background: #18243a;
  align-self: flex-start;
}
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 15px;
  background: #080d19;
  border-top: 1px solid #26334c;
}
.input-box {
  max-width: 750px;
  margin: auto;
  display: flex;
  gap: 8px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #35435c;
  background: #18243a;
  color: white;
  font-size: 15px;
}
button {
  background: #6558ee;
  color: white;
  border: none;
  padding: 14px 20px;
  border-radius: 12px;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div>
    <h2>Shaba AI</h2>
    <p>Your AI assistant</p>
  </div>
</header>

<main>
  <div class="welcome" id="welcome">
    <h1>Hello, welcome to <span>Shaba AI</span></h1>
    <p>What would you like help with today?</p>
  </div>
  <div id="chat"></div>
</main>

<div class="input-area">
  <div class="input-box">
    <input id="message" placeholder="Ask Shaba AI anything..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  document.getElementById("welcome").style.display = "none";

  const chat = document.getElementById("chat");

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  chat.appendChild(userMessage);

  const reply = document.createElement("div");
  reply.className = "message ai";
  reply.textContent = "Welcome to Shaba AI! Your chat interface is working. AI connection is coming in our next development stage.";
  chat.appendChild(reply);

  input.value = "";
  window.scrollTo(0, document.body.scrollHeight);
}

document.getElementById("message").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
